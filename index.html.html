<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YÖKDİL Vocab — 2000 Kelime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0d12;--s1:#12161e;--s2:#1a1f2b;--s3:#232938;
--brd:#2c3344;--tx:#e4e8f0;--tx2:#7b8698;--tx3:#545d6e;
--ac:#6ee7b7;--ac2:#34d399;--acbg:rgba(110,231,183,.1);--acbrd:rgba(110,231,183,.25);
--dng:#f87171;--wrn:#fbbf24;--info:#60a5fa;--purple:#a78bfa;
--radius:14px;--radius-sm:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}

.app{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto;overflow:hidden}
.app-head{padding:16px 16px 0;flex-shrink:0}
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.app-nav{display:flex;gap:4px;padding:8px 12px 10px;background:var(--s1);border-top:1px solid var(--brd);flex-shrink:0}

.logo{text-align:center;padding:8px 0 12px}
.logo h1{font-family:'Instrument Serif',serif;font-size:26px;font-weight:400;letter-spacing:-.3px;
background:linear-gradient(135deg,var(--ac),#a78bfa,var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo small{font-size:12px;color:var(--tx2);display:block;margin-top:2px}

.stats{display:flex;gap:6px;margin-bottom:10px}
.stat{flex:1;background:var(--s1);border:1px solid var(--brd);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.stat span{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px}
.stat.green b{color:var(--ac)}.stat.yellow b{color:var(--wrn)}.stat.blue b{color:var(--info)}

.pbar{height:4px;background:var(--s2);border-radius:2px;margin-bottom:10px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--ac),#a78bfa);border-radius:2px;transition:width .4s ease}

.nav-btn{flex:1;padding:10px 4px 8px;border:none;border-radius:var(--radius-sm);background:transparent;
color:var(--tx3);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;transition:.2s;
display:flex;flex-direction:column;align-items:center;gap:3px}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.on{color:var(--ac);background:var(--acbg)}

/* CARD */
.card-wrap{perspective:900px;height:270px;margin:12px 0;touch-action:pan-y}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.card.r{animation:goR .28s ease forwards}.card.l{animation:goL .28s ease forwards}
@keyframes goR{to{transform:translateX(110%) rotate(6deg);opacity:0}}
@keyframes goL{to{transform:translateX(-110%) rotate(-6deg);opacity:0}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);padding:28px 24px;
display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--brd)}
.front{background:linear-gradient(150deg,var(--s1),var(--s2))}
.back{background:linear-gradient(150deg,#111827,var(--s2));transform:rotateY(180deg)}
.card-word{font-family:'Instrument Serif',serif;font-size:34px;font-weight:400;letter-spacing:-.5px}
.card-sub{font-size:12px;color:var(--tx3);margin-top:10px}
.card-tr{font-size:22px;font-weight:700;color:var(--ac);text-align:center;margin-bottom:10px}

.actions{display:flex;gap:10px;justify-content:center;padding:4px 0 8px}
.act{padding:13px 28px;border:none;border-radius:var(--radius);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.act:active{transform:scale(.95)}
.act-y{background:rgba(110,231,183,.12);color:var(--ac);border:1px solid var(--acbrd)}
.act-n{background:rgba(248,113,113,.12);color:var(--dng);border:1px solid rgba(248,113,113,.25)}

/* QUIZ */
.qcard{background:var(--s1);border:1px solid var(--brd);border-radius:var(--radius);padding:28px 20px;text-align:center}
.qword{font-family:'Instrument Serif',serif;font-size:30px;margin-bottom:22px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qo{padding:13px 16px;border:1px solid var(--brd);border-radius:var(--radius-sm);background:var(--s2);
color:var(--tx);font-family:inherit;font-size:14px;cursor:pointer;text-align:left;transition:.15s}
.qo:hover:not(.done){border-color:var(--ac);background:rgba(110,231,183,.04)}
.qo.ok{border-color:var(--ac);background:rgba(110,231,183,.15);color:var(--ac)}
.qo.no{border-color:var(--dng);background:rgba(248,113,113,.12);color:var(--dng)}
.qnext{margin-top:16px;padding:11px 24px;border:none;border-radius:var(--radius-sm);
background:var(--ac);color:var(--bg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.qscore{display:flex;gap:16px;justify-content:center;margin-top:14px;padding:10px;background:var(--s1);border-radius:var(--radius-sm)}
.qdir{display:flex;gap:6px;margin-bottom:12px}
.qdir button{flex:1;padding:8px;border:1px solid var(--brd);border-radius:8px;background:var(--s2);color:var(--tx2);font-family:inherit;font-size:12px;cursor:pointer}
.qdir button.on{border-color:var(--ac);color:var(--ac);background:var(--acbg)}

/* LIST */
.search{width:100%;padding:11px 14px;border:1px solid var(--brd);border-radius:var(--radius-sm);
background:var(--s1);color:var(--tx);font-family:inherit;font-size:13px;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--ac)}
.search::placeholder{color:var(--tx3)}
.wlist{display:flex;flex-direction:column;gap:4px}
.wr{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--s1);border-radius:8px;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.k{background:var(--ac)}.dot.l{background:var(--wrn)}.dot.n{background:var(--tx3)}
.wen{font-weight:600;min-width:100px}.wtr{color:var(--tx2);flex:1;font-size:12px}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{padding:5px 10px;border:1px solid var(--brd);border-radius:16px;background:transparent;
color:var(--tx3);font-family:inherit;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{border-color:var(--ac);background:var(--acbg);color:var(--ac)}

.shuffle{padding:8px 14px;border:1px solid var(--brd);border-radius:8px;background:var(--s2);
color:var(--tx2);font-family:inherit;font-size:12px;cursor:pointer}
.shuffle:hover{border-color:var(--ac);color:var(--ac)}

.legend{display:flex;gap:14px;justify-content:center;margin-bottom:10px;font-size:11px;color:var(--tx2)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.empty{text-align:center;padding:40px 20px;color:var(--tx2);font-size:14px}

.reset{display:block;margin:20px auto 0;padding:10px 20px;border:1px solid rgba(248,113,113,.25);
border-radius:var(--radius-sm);background:transparent;color:var(--dng);font-family:inherit;font-size:12px;cursor:pointer;opacity:.7}
.reset:hover{opacity:1}

/* ======= PROGRESS VIEW ======= */
.pg-section{background:var(--s1);border:1px solid var(--brd);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.pg-title{font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pg-title svg{width:16px;height:16px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Streak */
.streak-row{display:flex;align-items:center;gap:16px;justify-content:center}
.streak-big{text-align:center}
.streak-big b{font-size:48px;font-weight:700;background:linear-gradient(135deg,var(--wrn),#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.streak-big span{display:block;font-size:12px;color:var(--tx2);margin-top:4px}
.streak-fire{font-size:40px;line-height:1}
.streak-msg{font-size:13px;color:var(--tx2);text-align:center;margin-top:8px;line-height:1.5}

/* Today card */
.today-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.today-item{background:var(--s2);border-radius:var(--radius-sm);padding:14px 10px;text-align:center}
.today-item b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.today-item span{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin-top:4px;display:block}

/* Goal ring */
.goal-wrap{display:flex;align-items:center;gap:20px;justify-content:center}
.goal-ring{position:relative;width:90px;height:90px}
.goal-ring svg{transform:rotate(-90deg)}
.goal-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.goal-center b{font-size:22px;font-weight:700;color:var(--ac)}
.goal-center span{font-size:10px;color:var(--tx2)}
.goal-info{font-size:13px;color:var(--tx2);line-height:1.6}
.goal-info b{color:var(--tx);font-weight:600}

/* Heatmap */
.heatmap{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;direction:rtl}
.heatmap::-webkit-scrollbar{height:0}
.hm-week{display:flex;flex-direction:column;gap:3px;direction:ltr}
.hm-day{width:14px;height:14px;border-radius:3px;background:var(--s2);transition:.15s}
.hm-day[data-lvl="1"]{background:#1a3a2a}
.hm-day[data-lvl="2"]{background:#1e5a38}
.hm-day[data-lvl="3"]{background:#25804a}
.hm-day[data-lvl="4"]{background:var(--ac2)}
.hm-day[data-lvl="5"]{background:var(--ac)}
.hm-labels{display:flex;justify-content:space-between;padding:4px 2px 0;direction:ltr}
.hm-labels span{font-size:9px;color:var(--tx3)}
.hm-tip{font-size:11px;color:var(--tx3);text-align:center;margin-top:6px}
.hm-legend{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;font-size:10px;color:var(--tx3)}
.hm-legend .hm-day{width:12px;height:12px;cursor:default}

/* Line chart */
.chart-canvas{width:100%;height:160px;position:relative}
.chart-svg{width:100%;height:100%}
.chart-labels{display:flex;justify-content:space-between;margin-top:4px}
.chart-labels span{font-size:9px;color:var(--tx3)}

/* Milestones */
.ms-list{display:flex;flex-direction:column;gap:8px}
.ms-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--radius-sm)}
.ms-item.done{background:rgba(110,231,183,.06)}
.ms-item.pending{background:var(--s2);opacity:.5}
.ms-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ms-item.done .ms-icon{background:rgba(110,231,183,.15)}
.ms-item.pending .ms-icon{background:var(--s3)}
.ms-text{flex:1}
.ms-text b{font-size:13px;display:block}
.ms-text span{font-size:11px;color:var(--tx2)}
.ms-bar{height:3px;background:var(--s3);border-radius:2px;margin-top:4px;overflow:hidden}
.ms-bar-fill{height:100%;background:var(--ac);border-radius:2px;transition:width .4s}

@media(max-width:400px){
.card-word{font-size:28px}.qword{font-size:26px}.card-wrap{height:250px}
.streak-big b{font-size:36px}.streak-fire{font-size:32px}
}
</style>
</head>

function ensureToday(){
  const t=today();
  if(!daily[t]) daily[t]={reviewed:0,correct:0,known:0,newLearned:0};
  return daily[t];
}

function status(i){const v=prog[i]||0;if(v>=3)return'k';if(v>0)return'l';return'n'}

function counts(){
  let k=0,l=0;
  for(let i=0;i<W.length;i++){const s=status(i);if(s==='k')k++;else if(s==='l')l++}
  return{k,l,n:W.length-k-l,pct:Math.round(k/W.length*100)}
}

function mark(i,good){
  const wasBefore=status(i);
  const cur=prog[i]||0;
  prog[i]=good?Math.min(cur+1,5):Math.max(cur-1,0);
  LS.set('prog',prog);
  const d=ensureToday();
  d.reviewed++;
  if(good) d.correct++;
  const afterSt=status(i);
  if(afterSt==='k'&&wasBefore!=='k') d.newLearned++;
  d.known=counts().k;
  daily[today()]=d;
  LS.set('daily',daily);
}

function getStreak(){
  let streak=0;
  const d=new Date();
  while(true){
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(daily[key]&&daily[key].reviewed>0){streak++;d.setDate(d.getDate()-1)}
    else break;
  }
  return streak;
}

function getFiltered(){
  if(filter==='new')return shuffled.filter(w=>status(W.indexOf(w))==='n');
  if(filter==='learning')return shuffled.filter(w=>status(W.indexOf(w))==='l');
  if(filter==='known')return shuffled.filter(w=>status(W.indexOf(w))==='k');
  return shuffled;
}

function shuffle(){shuffled=[...W].sort(()=>Math.random()-.5);ci=0;flipped=false;render()}

function startQuiz(){
  const sh=[...W].sort(()=>Math.random()-.5);
  const w=sh[0],wrong=sh.filter(x=>x!==w).slice(0,3);
  if(qdir==='en2tr'){
    const opts=[...wrong.map(x=>x.tr),w.tr].sort(()=>Math.random()-.5);
    quiz={w,opts,correct:w.tr,done:false};
  }else{
    const opts=[...wrong.map(x=>x.en),w.en].sort(()=>Math.random()-.5);
    quiz={w,opts,correct:w.en,done:false};
  }
  qans=null;
}

function answerQ(a){
  if(quiz.done)return;
  const ok=a===quiz.correct;
  qans={sel:a,ok};quiz.done=true;
  mark(W.indexOf(quiz.w),ok);
  qscore.c+=ok?1:0;qscore.w+=ok?0:1;qscore.t++;
  LS.set('qscore',qscore);render();
}

function nextCard(good){
  const fw=getFiltered();if(!fw.length)return;
  const cw=fw[ci%fw.length];mark(W.indexOf(cw),good);
  anim=good?'r':'l';render();
  setTimeout(()=>{anim='';flipped=false;ci=(ci+1)%Math.max(getFiltered().length,1);render()},250);
}

// --- Build Heatmap Data (last 90 days) ---
function heatmapData(){
  const days=[];const d=new Date();
  for(let i=0;i<91;i++){
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dd=daily[key];
    const rev=dd?dd.reviewed:0;
    let lvl=0;
    if(rev>=1)lvl=1;if(rev>=5)lvl=2;if(rev>=15)lvl=3;if(rev>=30)lvl=4;if(rev>=50)lvl=5;
    days.push({key,rev,lvl,dow:d.getDay()});
    d.setDate(d.getDate()-1);
  }
  days.reverse();
  // Group into weeks
  const weeks=[];let week=[];
  days.forEach((day,i)=>{
    week.push(day);
    if(day.dow===6||i===days.length-1){weeks.push(week);week=[]}
  });
  if(week.length)weeks.push(week);
  return{days,weeks};
}

// --- Build Chart Data (last 30 days) ---
function chartData(){
  const pts=[];const d=new Date();
  for(let i=29;i>=0;i--){
    const dd=new Date();dd.setDate(dd.getDate()-i);
    const key=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    const data=daily[key];
    pts.push({
      date:String(dd.getDate())+'/'+String(dd.getMonth()+1),
      known:data?data.known:0,
      reviewed:data?data.reviewed:0
    });
  }
  // Fill forward known values
  let lastKnown=0;
  pts.forEach(p=>{if(p.known>0)lastKnown=p.known;else p.known=lastKnown});
  return pts;
}

      <!-- HEATMAP -->
      <div class="pg-section">
        <div class="pg-title"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Son 90 Gün Aktivite</div>
        <div class="heatmap" id="heatmap"></div>
        <div class="hm-legend">
          <span>Az</span>
          <div class="hm-day" data-lvl="0"></div>
          <div class="hm-day" data-lvl="1"></div>
          <div class="hm-day" data-lvl="2"></div>
          <div class="hm-day" data-lvl="3"></div>
          <div class="hm-day" data-lvl="4"></div>
          <div class="hm-day" data-lvl="5"></div>
          <span>Çok</span>
        </div>
      </div>

      <!-- LINE CHART -->
      <div class="pg-section">
        <div class="pg-title"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Son 30 Gün Trend</div>
        <div class="chart-canvas">
          <svg class="chart-svg" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none">
            ${bars}
            <polygon points="${areaPts}" fill="url(#areaGrad)" opacity=".25"/>
            <polyline points="${linePts}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--ac)"/><stop offset="100%" stop-color="transparent"/></linearGradient></defs>
            <!-- Y labels -->
            <text x="2" y="${padT+6}" fill="var(--tx3)" font-size="9" font-family="DM Sans">${maxKnown}</text>
            <text x="2" y="${padT+usableH+4}" fill="var(--tx3)" font-size="9" font-family="DM Sans">0</text>
          </svg>
        </div>
        <div class="chart-labels">
          <span>${cd[0].date}</span>
          <span style="color:var(--purple);font-size:10px">■ Çalışılan</span>
          <span style="color:var(--ac);font-size:10px">— Bilinen</span>
          <span>${cd[cd.length-1].date}</span>
        </div>
      </div>

      <!-- MILESTONES -->
      <div class="pg-section">
        <div class="pg-title"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>Hedefler & Rozetler</div>
        <div class="ms-list">
          ${ms.map(m=>{
            const done=m.current>=m.target;
            const pct=Math.min(Math.round(m.current/m.target*100),100);
            return`<div class="ms-item ${done?'done':'pending'}">
              <div class="ms-icon">${m.icon}</div>
              <div class="ms-text">
                <b>${m.title}</b>
                <span>${m.desc} ${done?'✓':m.current+'/'+m.target}</span>
                ${!done?`<div class="ms-bar"><div class="ms-bar-fill" style="width:${pct}%"></div></div>`:''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <button class="reset" onclick="resetAll()">Tüm İlerlemeyi Sıfırla</button>`;
  }

  // ===== SETTINGS =====
  else if(view==='settings'){
    body=`<div style="padding:8px 0">
      <h3 style="font-size:16px;margin-bottom:12px">Ayarlar & Bilgi</h3>
      <div class="pg-section">
        <div style="font-size:13px;font-weight:600;margin-bottom:6px">Nasıl Kullanılır?</div>
        <div style="font-size:12px;color:var(--tx2);line-height:1.8">
          <b style="color:var(--ac)">Kartlar:</b> Flashcard ile çalış. "Biliyorum/Bilmiyorum" ile ilerleme kaydedilir.<br>
          <b style="color:var(--wrn)">Quiz:</b> 4 şıklı test. EN→TR veya TR→EN yönünü seç.<br>
          <b style="color:var(--info)">Liste:</b> Tüm kelimeleri ara ve durumlarını gör.<br>
          <b style="color:var(--purple)">İlerleme:</b> Seri, heatmap, grafik ve hedefler.<br><br>
          3 kez doğru bilinen kelime "Bilinen" olarak işaretlenir.<br>
          İlerleme tarayıcında kaydedilir (localStorage).
        </div>
      </div>
      <button class="reset" onclick="resetAll()">Tüm İlerlemeyi Sıfırla</button>
    </div>`;
  }

  document.getElementById('root').innerHTML=`
    <div class="app">
      <div class="app-head">
        <div class="logo"><h1>YÖKDİL Vocab</h1><small>Sosyal Bilimler — ${W.length} Kelime</small></div>
        <div class="stats">
          <div class="stat"><b>${c.pct}%</b><span>İlerleme</span></div>
          <div class="stat green"><b>${c.k}</b><span>Bilinen</span></div>
          <div class="stat yellow"><b>${c.l}</b><span>Öğrenilen</span></div>
          <div class="stat blue"><b>${c.n}</b><span>Yeni</span></div>
        </div>
        <div class="pbar"><div class="pbar-fill" style="width:${c.pct}%"></div></div>
      </div>
      <div class="app-body">${body}</div>
      <div class="app-nav">
        <button class="nav-btn ${view==='card'?'on':''}" onclick="view='card';render()">${icons.card}Kartlar</button>
        <button class="nav-btn ${view==='quiz'?'on':''}" onclick="view='quiz';quiz=null;render()">${icons.quiz}Quiz</button>
        <button class="nav-btn ${view==='list'?'on':''}" onclick="view='list';render()">${icons.list}Liste</button>
        <button class="nav-btn ${view==='progress'?'on':''}" onclick="view='progress';render()">${icons.prog}İlerleme</button>
        <button class="nav-btn ${view==='settings'?'on':''}" onclick="view='settings';render()">${icons.gear}Ayar</button>
      </div>
    </div>`;

  // Lazy render list
  if(view==='list'){
    const s=search.toLowerCase();
    const fl=W.filter(w=>w.en.toLowerCase().includes(s)||w.tr.toLowerCase().includes(s));
    const wl=document.getElementById('wlist');
    if(wl){
      const frag=document.createDocumentFragment();
      fl.slice(0,200).forEach(w=>{
        const d=document.createElement('div');d.className='wr';
        d.innerHTML=`<div class="dot ${status(W.indexOf(w))}"></div><span class="wen">${w.en}</span><span class="wtr">${w.tr}</span>`;
        frag.appendChild(d);
      });
      if(fl.length>200){const m=document.createElement('div');m.style.cssText='text-align:center;padding:12px;color:var(--tx3);font-size:12px';m.textContent='+ '+(fl.length-200)+' kelime daha';frag.appendChild(m)}
      wl.appendChild(frag);
    }
  }

  // Render heatmap
  if(view==='progress'){
    const hm=heatmapData();
    const hmEl=document.getElementById('heatmap');
    if(hmEl){
      hm.weeks.forEach(week=>{
        const col=document.createElement('div');col.className='hm-week';
        week.forEach(day=>{
          const d=document.createElement('div');d.className='hm-day';d.dataset.lvl=day.lvl;
          d.title=day.key+': '+day.rev+' kelime';
          col.appendChild(d);
        });
        hmEl.appendChild(col);
      });
    }
  }
}

ensureToday();
render();
</script>
</body>
</html>
